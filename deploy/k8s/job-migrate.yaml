# Drizzle migrations — runs the Dockerfile `migrator` image (node scripts/migrate.mjs).
#
# Modelled as an ArgoCD Sync-phase hook at wave 1 so that:
#   * it runs AFTER the DB StatefulSet (wave 0) is healthy on a first deploy
#     (a PreSync hook would deadlock — it'd wait for a DB the main sync hasn't
#     created yet), and
#   * BeforeHookCreation delete policy re-creates it on every sync, so schema
#     migrations re-run on each release (Drizzle migrate is idempotent).
# An init-container double-checks the DB is accepting connections first.
apiVersion: batch/v1
kind: Job
metadata:
  name: skillai-migrate
  labels:
    app.kubernetes.io/name: skillai-migrate
    app.kubernetes.io/part-of: skillai
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillai-migrate
        app.kubernetes.io/part-of: skillai
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          # Same digest as statefulset-db.yaml, and pinned for the same reason
          # (Factory#573 / Factory#588). This one is only here for `pg_isready`,
          # so the version matters less -- but it is a second unpinned entry
          # point for the same floating tag, and leaving it would mean the tag
          # could still be repointed under the cluster through a Job Pod.
          # Keep the two in step when bumping.
          image: pgvector/pgvector:pg17@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h skillai-db -p 5432; do
                echo "waiting for skillai-db..."; sleep 2;
              done
      containers:
        - name: migrate
          image: ghcr.io/olafkfreund/skillai-migrator:core-mvp-foundation
          imagePullPolicy: Always
          envFrom:
            # Provides DATABASE_URL (and the rest of the app env — harmless here).
            - secretRef:
                name: skillai-app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
