# Runs once on first Postgres init (empty data dir) via the standard
# /docker-entrypoint-initdb.d hook. Idempotent — also harmless if a restore
# later re-creates these objects (IF NOT EXISTS / OR REPLACE).
# Mirrors docker/init-db.sql from the compose stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skillai-db-init
  labels:
    app.kubernetes.io/name: skillai-db
    app.kubernetes.io/part-of: skillai
data:
  01-init-db.sql: |
    -- SkillAI database initialisation
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS vector;

    -- Function to set tenant context (used by RLS policies)
    CREATE OR REPLACE FUNCTION set_tenant_context(p_tenant_id UUID)
    RETURNS void AS $$
    BEGIN
      PERFORM set_config('app.tenant_id', p_tenant_id::text, true);
    END;
    $$ LANGUAGE plpgsql SECURITY DEFINER;
