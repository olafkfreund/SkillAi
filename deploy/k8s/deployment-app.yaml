# SkillAi Next.js app (standalone).
# Sync-wave 2: rolls out after DB (0) and migrations (1).
# Recreate strategy because the uploads PVC is RWO (single-node bound).
#
# Public exposure: in-cluster cloudflared (factory-gitops infra/cloudflared/)
# routes skillai.<home-domain> → http://skillai-app.factory.svc.cluster.local:3000.
# The Tailscale sidecar was removed 2026-06-07 — see
# factory-gitops public-ingress architecture for the rationale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillai-app
  labels:
    app.kubernetes.io/name: skillai-app
    app.kubernetes.io/part-of: skillai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skillai-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillai-app
        app.kubernetes.io/part-of: skillai
    spec:
      # Factory#624. This Deployment was the last one in the cluster's `factory`
      # namespace on pure container-runtime defaults: pod and container
      # securityContext both {}, all 14 default capabilities, unconfined
      # seccomp. The hardening sweep that fixed everything else (Factory#521)
      # could not reach it, because those manifests live in factory-gitops and
      # these do not -- ArgoCD syncs this path straight from this repo.
      #
      # No fsGroup, deliberately. The uploads PVC is ALREADY owned 1001:1001
      # (measured across the whole tree, /app/uploads is drwxrwxrwx 1001:1001
      # and every existing upload is 1001:1001), so there is nothing for a
      # recursive fsGroup pass to fix, and adding one would mean a recursive
      # chown of a user-data volume on every pod start for no benefit.
      #
      # readOnlyRootFilesystem is NOT set here, and that is a considered gap
      # rather than an oversight. Measured: with it on, the app starts clean
      # and serves /api/health 200, / 307, /login 200, /favicon.ico 200 with
      # no EROFS in the logs. What was NOT exercised is the upload-and-parse
      # path, which needs an authenticated session -- and this is a
      # document-upload app, so that is exactly the path most likely to want a
      # scratch write. Recorded so the next person starts from evidence
      # instead of repeating the easy half.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ── App ───────────────────────────────────────────────────────────
        - name: app
          image: ghcr.io/olafkfreund/skillai:core-mvp-foundation
          imagePullPolicy: Always
          # REQUIRES the image from #306. Until that entrypoint change is in
          # the tag above, `drop: ["ALL"]` kills this pod on every start with
          # `su-exec: setgroups: Operation not permitted` -- su-exec needs
          # CAP_SETGID to drop privileges, and dropping ALL takes it away.
          # Measured on the live cluster, twice, in both failure directions.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # Auth.js v5 needs to know the public URL it's reached at so
            # callback URLs are correct. Cloudflare Tunnel terminates TLS
            # at its edge; we get plain HTTP from cloudflared on the
            # loopback hop — AUTH_TRUST_HOST below tells Auth.js to trust
            # the X-Forwarded-* headers cloudflared sets.
            - name: NEXTAUTH_URL
              value: https://skillai.freundcloud.org.uk
            - name: AUTH_TRUST_HOST
              value: "true"
          envFrom:
            # DATABASE_URL, NEXTAUTH_SECRET, ANTHROPIC_API_KEY, ENCRYPTION_KEY,
            # BRAVE_SEARCH_API_KEY, GITHUB_TOKEN — seeded out-of-band.
            - secretRef:
                name: skillai-app
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: skillai-uploads
