# SkillAi Next.js app (standalone).
# Sync-wave 2: rolls out after DB (0) and migrations (1).
# Recreate strategy because the uploads PVC is RWO (single-node bound).
#
# Public exposure: in-cluster cloudflared (factory-gitops infra/cloudflared/)
# routes skillai.<home-domain> → http://skillai-app.factory.svc.cluster.local:3000.
# The Tailscale sidecar was removed 2026-06-07 — see
# factory-gitops public-ingress architecture for the rationale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillai-app
  labels:
    app.kubernetes.io/name: skillai-app
    app.kubernetes.io/part-of: skillai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skillai-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillai-app
        app.kubernetes.io/part-of: skillai
    spec:
      containers:
        # ── App ───────────────────────────────────────────────────────────
        - name: app
          image: ghcr.io/olafkfreund/skillai:core-mvp-foundation
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            # Auth.js v5 needs to know the public URL it's reached at so
            # callback URLs are correct. Cloudflare Tunnel terminates TLS
            # at its edge; we get plain HTTP from cloudflared on the
            # loopback hop — AUTH_TRUST_HOST below tells Auth.js to trust
            # the X-Forwarded-* headers cloudflared sets.
            - name: NEXTAUTH_URL
              value: https://skillai.freundcloud.org.uk
            - name: AUTH_TRUST_HOST
              value: "true"
          envFrom:
            # DATABASE_URL, NEXTAUTH_SECRET, ANTHROPIC_API_KEY, ENCRYPTION_KEY,
            # BRAVE_SEARCH_API_KEY, GITHUB_TOKEN — seeded out-of-band.
            - secretRef:
                name: skillai-app
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: skillai-uploads
