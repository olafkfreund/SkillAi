# PostgreSQL 17 + pgvector — mirrors the compose `db` service.
# Sync-wave 0: comes up (and reports healthy) before the migration hook (wave 1)
# and the app (wave 2). Storage is the k3d default local-path provisioner,
# node-bound RWO — fine for a single DB replica.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skillai-db
  labels:
    app.kubernetes.io/name: skillai-db
    app.kubernetes.io/part-of: skillai
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: skillai-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skillai-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillai-db
        app.kubernetes.io/part-of: skillai
    spec:
      securityContext:
        # Debian postgres image runs as uid/gid 999; make the local-path PV
        # writable by that group.
        fsGroup: 999
      containers:
        - name: postgres
          # Pinned by digest: a tag is a pointer, and `pg17` is a floating
          # major-line tag that moves on every PostgreSQL 17 patch release and
          # every pgvector rebuild. Unpinned, any restart or reschedule of this
          # Pod silently swaps the bytes under a live data directory, with no
          # record. Factory#573 / Factory#588.
          #
          # This digest is the one ALREADY RUNNING on the cluster (measured
          # 2026-08-07), not registry HEAD, so pinning re-pulls nothing and
          # moves no version. Both carry PG_VERSION 17.10-1.pgdg12+1 and
          # pgvector 0.8.2; HEAD (sha256:7ae6051e) is a later Debian base
          # rebuild and adopting it is a deliberate upgrade of a live database,
          # not a side effect of pinning.
          #
          # The tag is kept alongside the digest so the version stays legible
          # without a registry round-trip. Bump both together; nothing
          # refreshes this automatically (factory-gitops#139).
          image: pgvector/pgvector:pg17@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            # Provides POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB.
            # Seeded out-of-band (see deploy/k8s/README.md).
            - secretRef:
                name: skillai-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Postgres uses POSIX shared memory under /dev/shm. The container's
            # default /dev/shm is only 64Mi on this k3d node, which makes initdb
            # bootstrap die with "Bus error (core dumped)". Back it with a
            # Memory emptyDir so shared_buffers/parallel workers have room.
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # The p510 node reserves 2Mi huge pages (HugePages_Total=1024) and
            # Postgres defaults to huge_pages=try. Without a hugepages allocation
            # the container's hugetlb cgroup limit is 0: MAP_HUGETLB succeeds but
            # the first page access SIGBUSes ("Bus error" during initdb) and
            # 'try' never falls back. Granting hugepages-2Mi raises the cgroup
            # limit so Postgres can actually use them. (See deploy/k8s/README.md.)
            requests:
              cpu: 100m
              memory: 256Mi
              hugepages-2Mi: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
              hugepages-2Mi: 512Mi
      volumes:
        - name: init
          configMap:
            name: skillai-db-init
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
