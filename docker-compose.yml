services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillai}:${POSTGRES_PASSWORD:-skillai}@db:5432/${POSTGRES_DB:-skillai}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skillai_net
    restart: "no"

  app:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillai}:${POSTGRES_PASSWORD:-skillai}@db:5432/${POSTGRES_DB:-skillai}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_DIR: /app/uploads
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    healthcheck:
      # node:22-alpine doesn't ship curl. wget is BusyBox-built-in.
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - skillai_net
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillai}
      POSTGRES_DB: ${POSTGRES_DB:-skillai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillai -d skillai']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillai_net
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  skillai_net:
    driver: bridge
