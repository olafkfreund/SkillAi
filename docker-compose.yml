services:
  app:
    build:
      context: .
      target: runner
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://skillai:skillai@db:5432/skillai
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skillai_net
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: skillai
      POSTGRES_PASSWORD: skillai
      POSTGRES_DB: skillai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillai -d skillai']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skillai_net
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  skillai_net:
    driver: bridge
