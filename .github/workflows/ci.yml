# ci.yml
#
# Continuous integration gate for pull requests targeting core-mvp-foundation.
#
# Runs four jobs in parallel where possible:
#   1. lint      — ESLint with --max-warnings=99999 (errors block, warnings allowed)
#                  Baseline established in PR #178 ci/eslint-baseline:
#                    • 0 errors required; warnings are non-blocking for v1
#                    • Re-evaluate warning gate once warning count is <50
#   2. test      — vitest unit + integration tests (excludes DB integration tests
#                  that require RUN_DB_INTEGRATION_TESTS=true and a live Postgres)
#   3. typecheck — tsc --noEmit across the whole project (src + tests)
#   4. build     — next build with stub env vars to catch compile-time errors
#                  (depends on test + typecheck so we don't waste build minutes
#                  on a branch that's already red)
#
# Why stub env vars for build:
#   next.config.ts uses `output: 'standalone'` and all routes carry
#   `export const dynamic = 'force-dynamic'` so no static prerendering runs.
#   The postgres pool is created at module scope but connections are lazy —
#   no TCP connection is attempted until a query executes. AUTH_SECRET and
#   ENCRYPTION_KEY are only validated at request time, not build time.
#   Therefore a syntactically-valid placeholder is sufficient for `next build`.
#
# Why not e2e:
#   Playwright e2e tests (test:e2e) require a running Postgres + Next.js server
#   and are therefore not suitable for this PR-gate workflow. They will be
#   addressed in a dedicated e2e-in-CI spec.

name: CI

on:
  pull_request:
    branches:
      - core-mvp-foundation
  push:
    branches:
      - core-mvp-foundation

# Cancel in-progress runs for the same PR or branch so stale runs
# don't consume runners after a force-push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. lint — ESLint (errors block CI; warnings are non-blocking)
  #
  # --max-warnings=99999 allows any number of warnings through while still
  # exiting non-zero on any error.  The warning count will be reduced in
  # follow-up cleanup PRs; keeping this generous cap avoids churn in the
  # short term.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_ENV: test
        run: npm ci

      - name: Lint
        # Exit non-zero on any error; warnings are allowed (--max-warnings=99999).
        # ESLint exits 1 when there are errors regardless of --max-warnings.
        run: npx eslint . --max-warnings=99999

  # ---------------------------------------------------------------------------
  # 2. test — vitest run (NODE_ENV=test is set in the npm script)
  # ---------------------------------------------------------------------------
  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # NODE_ENV must NOT be 'production' here — that causes npm ci to omit
        # devDependencies (including vitest). Unset it explicitly.
        env:
          NODE_ENV: test
        run: npm ci

      - name: Run tests
        # Stub AI keys so resolveAnthropicKey()/resolveGoogleKey() succeed.
        # The SDK calls themselves are mocked in tests/unit/ai/*.test.ts via
        # vi.mock('@anthropic-ai/sdk') and equivalents — these stubs only
        # satisfy the key-resolution layer that runs before the mocked client.
        env:
          ANTHROPIC_API_KEY: stub-anthropic-key
          GEMINI_API_KEY: stub-gemini-key
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. typecheck — tsc --noEmit across src/ + tests/
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_ENV: test
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # 3. build — next build with stub env vars
  # ---------------------------------------------------------------------------
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Build only needs prod + peer deps, but NODE_ENV=test ensures a
        # consistent install regardless of the host environment variable.
        env:
          NODE_ENV: test
        run: npm ci

      - name: Build
        # DATABASE_URL: stub connection string — pool is created lazily; no
        #   TCP connection is made during build because all routes are force-dynamic.
        # AUTH_SECRET: Auth.js v5 requires a value at runtime; during build
        #   no request handlers execute, so any non-empty string is sufficient.
        # ENCRYPTION_KEY: used only in request-time crypto helpers; not
        #   evaluated during static analysis.
        # NEXT_TELEMETRY_DISABLED: suppress telemetry pings from CI runners.
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_stub'
          AUTH_SECRET: 'ci-stub-secret-must-be-at-least-32-chars-x'
          ENCRYPTION_KEY: 'ci-stub-encryption-key-placeholder'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
