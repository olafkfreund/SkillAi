# ci.yml
#
# Continuous integration gate for pull requests targeting core-mvp-foundation.
#
# Runs six jobs in parallel where possible:
#   1. lint      — ESLint with --max-warnings=99999 (errors block, warnings allowed)
#                  Baseline established in PR #178 ci/eslint-baseline:
#                    • 0 errors required; warnings are non-blocking for v1
#                    • Re-evaluate warning gate once warning count is <50
#   2. test      — vitest unit + integration tests (excludes DB integration tests
#                  that require RUN_DB_INTEGRATION_TESTS=true and a live Postgres)
#   3. typecheck — tsc --noEmit across the whole project (src + tests)
#   4. build     — next build with stub env vars to catch compile-time errors
#                  (depends on test + typecheck so we don't waste build minutes
#                  on a branch that's already red)
#   5. k8s-hardening  — securityContext ratchet for deploy/k8s (Factory#624)
#   6. k8s-manifests  — deploy/k8s builds, schema-checks and stays digest-pinned
#                       (#305). ArgoCD syncs that directory straight onto the
#                       cluster, so these two jobs are the only thing between a
#                       commit and production.
#
# Why stub env vars for build:
#   next.config.ts uses `output: 'standalone'` and all routes carry
#   `export const dynamic = 'force-dynamic'` so no static prerendering runs.
#   The postgres pool is created at module scope but connections are lazy —
#   no TCP connection is attempted until a query executes. AUTH_SECRET and
#   ENCRYPTION_KEY are only validated at request time, not build time.
#   Therefore a syntactically-valid placeholder is sufficient for `next build`.
#
# Why not e2e:
#   Playwright e2e tests (test:e2e) require a running Postgres + Next.js server
#   and are therefore not suitable for this PR-gate workflow. They will be
#   addressed in a dedicated e2e-in-CI spec.

name: CI

on:
  pull_request:
    branches:
      - core-mvp-foundation
  push:
    branches:
      - core-mvp-foundation

# Cancel in-progress runs for the same PR or branch so stale runs
# don't consume runners after a force-push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. lint — ESLint (errors block CI; warnings are non-blocking)
  #
  # --max-warnings=99999 allows any number of warnings through while still
  # exiting non-zero on any error.  The warning count will be reduced in
  # follow-up cleanup PRs; keeping this generous cap avoids churn in the
  # short term.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_ENV: test
        run: npm ci

      - name: Lint
        # Exit non-zero on any error; warnings are allowed (--max-warnings=99999).
        # ESLint exits 1 when there are errors regardless of --max-warnings.
        run: npx eslint . --max-warnings=99999

  # ---------------------------------------------------------------------------
  # 2. test — vitest run (NODE_ENV=test is set in the npm script)
  # ---------------------------------------------------------------------------
  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # NODE_ENV must NOT be 'production' here — that causes npm ci to omit
        # devDependencies (including vitest). Unset it explicitly.
        env:
          NODE_ENV: test
        run: npm ci

      - name: Run tests
        # Stub AI keys so resolveAnthropicKey()/resolveGoogleKey() succeed.
        # The SDK calls themselves are mocked in tests/unit/ai/*.test.ts via
        # vi.mock('@anthropic-ai/sdk') and equivalents — these stubs only
        # satisfy the key-resolution layer that runs before the mocked client.
        env:
          ANTHROPIC_API_KEY: stub-anthropic-key
          GEMINI_API_KEY: stub-gemini-key
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. typecheck — tsc --noEmit across src/ + tests/
  # ---------------------------------------------------------------------------
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          NODE_ENV: test
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # 3. build — next build with stub env vars
  # ---------------------------------------------------------------------------
  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Build only needs prod + peer deps, but NODE_ENV=test ensures a
        # consistent install regardless of the host environment variable.
        env:
          NODE_ENV: test
        run: npm ci

      - name: Build
        # DATABASE_URL: stub connection string — pool is created lazily; no
        #   TCP connection is made during build because all routes are force-dynamic.
        # AUTH_SECRET: Auth.js v5 requires a value at runtime; during build
        #   no request handlers execute, so any non-empty string is sufficient.
        # ENCRYPTION_KEY: used only in request-time crypto helpers; not
        #   evaluated during static analysis.
        # NEXT_TELEMETRY_DISABLED: suppress telemetry pings from CI runners.
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_stub'
          AUTH_SECRET: 'ci-stub-secret-must-be-at-least-32-chars-x'
          ENCRYPTION_KEY: 'ci-stub-encryption-key-placeholder'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # ---------------------------------------------------------------------------
  # 5. k8s-hardening — pod securityContext ratchet for deploy/k8s
  #
  # ArgoCD syncs deploy/k8s straight from this repo, so factory-gitops' own
  # hardening ratchet structurally cannot see these manifests. It reported
  # "18/18 banked workloads" green for as long as skillai-app ran with no
  # securityContext at all -- invisible, not passing (Factory#624).
  #
  # Kyverno admission in that cluster is Audit for all but one narrow rule, so
  # it will ADMIT an unhardened pod too. This job is the only thing that
  # refuses one, which is why it is here rather than there.
  #
  # Independent of the Node jobs, so it still reports on a manifest-only PR.
  # ---------------------------------------------------------------------------
  k8s-hardening:
    name: Pod hardening (deploy/k8s)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install PyYAML
        # Pinned deliberately: the assertion script exits 1 when it cannot
        # import yaml, so a silent resolution change turns into a red build
        # rather than a gate that parses nothing.
        run: python3 -m pip install --upgrade 'PyYAML==6.0.2'

      - name: Assert deploy/k8s workloads are still hardened
        run: python3 scripts/assert-k8s-hardening.py deploy/k8s

  # ---------------------------------------------------------------------------
  # 6. k8s-manifests — does deploy/k8s render, parse, and stay pinned (#305)
  #
  # deploy/k8s is a live production deployment target: factory-gitops
  # apps/skillai/application.yaml points ArgoCD at this repo, branch
  # core-mvp-foundation, path deploy/k8s, with automated prune + selfHeal. There
  # is nothing between a commit here and the cluster. The k8s-hardening job
  # above reads the source files for securityContext only; it does not build the
  # kustomization, does not schema-check anything, and does not look at images.
  # So until this job, a manifest that fails `kustomize build` or carries a
  # typo'd key reached ArgoCD and surfaced as a sync error after the fact.
  #
  # That got more expensive on 2026-08-07, when the cluster's signature
  # ClusterPolicy went to Enforce: a manifest that degraded quietly yesterday is
  # a denied admission today.
  #
  # Separate job from k8s-hardening on purpose -- different failure, different
  # red X, and it still reports if the hardening ratchet is what broke.
  # ---------------------------------------------------------------------------
  k8s-manifests:
    name: Manifest validation (deploy/k8s)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install kustomize, kubeconform and PyYAML
        run: |
          set -euo pipefail
          curl -sfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin kustomize
          curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
          python3 -m pip install --upgrade 'PyYAML==6.0.2'
          # Rule 4.7: prove the tools are usable before claiming anything
          # passed. A download that 404s into a 0-byte file still leaves a file
          # behind, and `set -e` alone will not notice a gate that then runs
          # nothing.
          kustomize version
          kubeconform -v

      - name: Build, schema-check and assert digest pins
        # `set -e` deliberately, matching the shell GitHub uses, but WITHOUT a
        # pipeline that can swallow a failure: each stage writes a file and is
        # checked on its own line. factory-gitops#140's gate broke on exactly
        # this -- a step that looked sequential but lost an exit code in a pipe.
        run: |
          set -euo pipefail

          # 1. It must build at all. This is the failure ArgoCD reports after
          #    the fact today, on the only branch that matters.
          kustomize build deploy/k8s > rendered.yaml

          # 2. An empty build is not a passing build. kustomize exits 0 for a
          #    kustomization that resources its way to nothing, and zero
          #    documents then sail through every check below.
          if [ ! -s rendered.yaml ]; then
            echo "::error file=deploy/k8s/kustomization.yaml::kustomize build produced no output -- this gate validated nothing"
            exit 1
          fi

          # 3. -strict rejects unknown fields, which is what catches a typo'd
          #    key that Kubernetes would otherwise silently drop.
          #    -ignore-missing-schemas skips KINDS with no upstream schema; every
          #    core kind here is still checked strictly.
          kubeconform -strict -ignore-missing-schemas -summary rendered.yaml

          # 4. Digest pins, read from the RENDERED output rather than the source
          #    files, because the `images:` transformer sits between them.
          python3 scripts/assert-k8s-images-pinned.py < rendered.yaml
