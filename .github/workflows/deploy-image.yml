# deploy-image.yml
#
# Builds the SkillAi container images and publishes them to GHCR so the k3d
# cluster on p510 (ArgoCD, factory-gitops apps/skillai) can pull them.
#
# Two images from the multi-stage Dockerfile:
#   - ghcr.io/olafkfreund/skillai           (target: runner   — the Next.js app)
#   - ghcr.io/olafkfreund/skillai-migrator  (target: migrator — drizzle migrate)
#
# Tags pushed: the branch name (e.g. `core-mvp-foundation` / `main` alias) and
# the commit SHA. Pin an immutable :<sha> in deploy/k8s/kustomization.yaml for
# production rollouts.
#
# NOTE: make both GHCR packages public (or add an imagePullSecret in-cluster)
# so the p510 nodes can pull without registry auth.

name: Deploy Image

on:
  push:
    branches:
      - core-mvp-foundation
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'Dockerfile'
      - 'docker/entrypoint.sh'
      - 'scripts/migrate.mjs'
      - '.github/workflows/deploy-image.yml'
  workflow_dispatch:

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository_owner }}/skillai
  IMAGE_MIGRATOR: ghcr.io/${{ github.repository_owner }}/skillai-migrator

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      # contents: write so the job can commit the pinned image tag back to git
      # (GitOps image promotion — ArgoCD then auto-syncs the new SHA).
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so the rebase-before-push in the pin step is reliable
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase branch ref → a valid Docker tag (e.g. core-mvp-foundation).
      - name: Compute tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          SHA="${GITHUB_SHA::12}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build & push app image (runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_APP }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=skillai-runner
          cache-to: type=gha,mode=max,scope=skillai-runner

      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.IMAGE_MIGRATOR }}:${{ steps.tags.outputs.branch }}
            ${{ env.IMAGE_MIGRATOR }}:${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=skillai-migrator
          cache-to: type=gha,mode=max,scope=skillai-migrator

      # GitOps image promotion: pin the freshly-built immutable SHA tag into
      # deploy/k8s/kustomization.yaml and commit it back. ArgoCD watches git,
      # sees the changed tag, and rolls out the new image automatically — no
      # mutable-tag guessing, no manual `kubectl rollout restart`.
      #
      # Loop-safety: this commit only touches deploy/k8s/kustomization.yaml,
      # which is NOT in this workflow's trigger paths, and it carries [skip ci],
      # so it cannot retrigger any workflow.
      - name: Pin image tag in kustomization + commit
        env:
          SHA: ${{ steps.tags.outputs.sha }}
        run: |
          set -euo pipefail
          yq -i '(.images[] | select(.name == "ghcr.io/olafkfreund/skillai").newTag) = strenv(SHA)' deploy/k8s/kustomization.yaml
          yq -i '(.images[] | select(.name == "ghcr.io/olafkfreund/skillai-migrator").newTag) = strenv(SHA)' deploy/k8s/kustomization.yaml

          if git diff --quiet -- deploy/k8s/kustomization.yaml; then
            echo "kustomization already at ${SHA}; nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore(deploy): pin image to ${SHA} [skip ci]"
          # rebase onto any concurrent pushes before pushing back
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        run: |
          {
            echo "### Images pushed & pinned"
            echo ""
            echo "- \`${IMAGE_APP}:${{ steps.tags.outputs.sha }}\` (+ \`:${{ steps.tags.outputs.branch }}\`)"
            echo "- \`${IMAGE_MIGRATOR}:${{ steps.tags.outputs.sha }}\` (+ \`:${{ steps.tags.outputs.branch }}\`)"
            echo ""
            echo "Pinned \`deploy/k8s/kustomization.yaml\` → \`:${{ steps.tags.outputs.sha }}\`; ArgoCD will sync the rollout."
          } >> "$GITHUB_STEP_SUMMARY"
