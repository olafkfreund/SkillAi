services:
  app:
    build:
      target: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      ANTHROPIC_API_KEY: ${SKILLAI_ANTHROPIC_API_KEY}
    command: npm run dev
  db:
    ports:
      - '5433:5432'
