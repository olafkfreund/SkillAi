  AUTH_SECRET: __AUTH_SECRET__
  NEXTAUTH_URL: __NEXTAUTH_URL__
  ENCRYPTION_KEY: __ENCRYPTION_KEY__
  ANTHROPIC_API_KEY: __ANTHROPIC_API_KEY__
  GEMINI_API_KEY: __GEMINI_API_KEY__
  OPENAI_API_KEY: __OPENAI_API_KEY__
  BRAVE_SEARCH_API_KEY: __BRAVE_SEARCH_API_KEY__
  GITHUB_TOKEN: __GITHUB_TOKEN__
  CRON_SECRET: __CRON_SECRET__
  NODE_ENV: production
  UPLOAD_DIR: /app/uploads
  APP_URL: __APP_URL__
  NEXT_PUBLIC_APP_URL: __NEXT_PUBLIC_APP_URL__
