apiVersion: batch/v1
kind: Job
metadata:
  name: skillai-migrate
  namespace: skillai
  labels:
    app.kubernetes.io/name: skillai
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skillai
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: migrate
          # Same image as the app; tag pinned by overlay.
          image: skillai:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: skillai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
